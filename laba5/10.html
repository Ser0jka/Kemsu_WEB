<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pseudo-class Practice</title>
    <style>
        a {
            display: block;
            color: black;
            border: 1px solid black;
            padding: 10px;
            width: 200px;
        }

        a:hover div:nth-child(5) {
            font-size: 24px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a>
      <div>Div 1</div>
      <div>Div 2</div>
      <div>Div 3</div>
      <div>Div 4</div>
      <div>Div 5</div>
      <div>Div 6</div>
    </a>

</body>
</html>
